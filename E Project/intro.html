<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Alpine Astine - Enter the Mountains</title>

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="intro.css">
</head>
<body>

  <canvas id="mountainCanvas"></canvas>

  <div class="intro-vignette"></div>

  <div class="intro-overlay">
    <img src="assets/logo.png" alt="Alpine Astine" class="intro-logo">

    <div class="zoom-prompt" id="zoomPrompt">
      <span class="zoom-prompt-icon"><i class="bi bi-chevron-double-up"></i></span>
      <span class="zoom-prompt-text" id="zoomPromptText">Zoom In To Enter</span>
    </div>

    <div class="zoom-progress-track">
      <div class="zoom-progress-fill" id="zoomProgressFill"></div>
    </div>
  </div>

  <div class="transition-overlay" id="transitionOverlay"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="intro.js"></script>
  <script src="sound-widget.js"></script>
</body>
</html>
